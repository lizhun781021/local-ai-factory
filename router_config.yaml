routing_rules:
- name: explicit-model
  match_type: explicit
  description: 请求中显式指定了模型名，直接路由
- name: vision-request
  match_type: vision
  target: qwen3.8-27b-resident
  fallback:
  - qwen3.6-27b-remote
  - qwen3.6-35b-moe
  description: 图片理解请求路由到多模态模型(与文本对话共用 Qwen3.8)
- name: code-task
  match_type: keyword
  keywords:
  - 代码
  - code
  - 函数
  - function
  - bug
  - 调试
  - debug
  - 编程
  - program
  - 脚本
  - script
  - 算法
  - algorithm
  - python
  - javascript
  - java
  - rust
  - go语言
  - SQL
  - 正则
  - regex
  - API接口
  - 重构
  - refactor
  target: qwen3.8-27b-resident
  fallback:
  - qwen3.6-27b-remote
  - qwen3.6-35b-moe
  description: 代码任务→Qwen3.8(快+强)，远程降级不占内存
- name: reasoning-task
  match_type: keyword
  keywords:
  - 推理
  - reasoning
  - 证明
  - prove
  - 数学
  - math
  - 逻辑
  - logic
  - 分析
  - analyze
  - 计算
  - calculate
  - 概率
  - 统计
  - 最优
  - 优化
  - optimize
  target: qwen3.6-35b-moe
  fallback:
  - qwen3.6-27b-remote
  - qwen3.8-27b-resident
  description: 推理/数学→Qwen3.6-MoE，远程降级，Qwen3.8兜底
- name: short-chat
  match_type: length
  max_tokens: 200
  target: gemma4-12b-ollama
  fallback:
  - qwen3.8-27b-resident
  - qwen3.6-27b-remote
  description: 短消息(≤200token)→Ollama最快，Qwen3.8降级
- name: long-context
  match_type: length
  min_tokens: 4000
  target: qwen3.8-27b-resident
  fallback:
  - qwen3.6-35b-moe
  description: 长文本(≥4000token)→Qwen3.8 128K上下文
- name: default
  match_type: default
  target: qwen3.8-27b-resident
  fallback:
  - qwen3.6-27b-remote
  - qwen3.6-35b-moe
  - gemma4-12b-ollama
  description: 默认→Qwen3.8常驻主力，远程降级不占内存，Ollama兜底
